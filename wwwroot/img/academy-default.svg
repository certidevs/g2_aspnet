  <!-- Frontón triangular -->
  <polygon points="200,80 290,140 110,140" fill="#3f6f99"/>
  <!-- Banda decorativa bajo el frontón -->
  <rect x="110" y="140" width="180" height="12" fill="#d9e8f3"/>
  <!-- Columnas -->
  <rect x="130" y="152" width="14" height="98" fill="#d9e8f3"/>
  <rect x="165" y="152" width="14" height="98" fill="#d9e8f3"/>
  <rect x="200" y="152" width="14" height="98" fill="#d9e8f3"/>
  <rect x="235" y="152" width="14" height="98" fill="#d9e8f3"/>
  <rect x="270" y="152" width="14" height="98" fill="#d9e8f3"/>
  <!-- Puerta central -->
  <rect x="193" y="200" width="28" height="50" fill="#2f5578"/>
  <!-- Escalones -->
  <rect x="70" y="250" width="260" height="10" fill="#a8c8dd"/>
  <rect x="60" y="260" width="280" height="10" fill="#8fb3cb"/>
  <!-- Bandera -->
